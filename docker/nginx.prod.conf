# ============================================================
#  GoldArena 生产 nginx 配置 (HTTPS + WebSocket)
#  由 docker/Dockerfile.web 构建进 web 容器，监听 443
#  SSL 证书挂载路径: /etc/nginx/ssl/fullchain.pem, /etc/nginx/ssl/privkey.pem
# ============================================================

server {
    listen 80;
    server_name _;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API + WebSocket 反向代理到网关
    # 前端 WebSocket 路径为 /api/v1/ws?token=...，与 /api/ 同源，
    # 因此这里统一带上 Upgrade/Connection 头，REST 与 WS 共用此 location
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
